services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-execute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-execute}
      POSTGRES_DB: ${POSTGRES_DB:-execute_dashboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://execute:execute@postgres:5432/execute_dashboard}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
      WORKSPACE_ENV_ENCRYPTION_KEY: ${WORKSPACE_ENV_ENCRYPTION_KEY:-SDJ5GYTawwnCZRYJ3wc8UNvbcmitbdkswaq14sV1phc=}
      EDITOR_PUBLIC_URL: ${EDITOR_PUBLIC_URL:-http://localhost:8080}
      EDITOR_CONTAINER_WORKSPACE_ROOT: ${EDITOR_CONTAINER_WORKSPACE_ROOT:-/workspace}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ${HOST_WORKSPACE_ROOT:-/Users/rangga/workspace}:/workspace
      - backend_venv:/app/.venv
    command: sh -lc "git config --global --replace-all safe.directory '*' && uv sync --locked --no-dev && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  code-server:
    image: codercom/code-server:latest
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-execute}
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ${HOST_WORKSPACE_ROOT:-/Users/rangga/workspace}:/workspace
      - code_server_config:/home/coder/.config
      - code_server_data:/home/coder/.local/share/code-server
    command: ["--bind-addr", "0.0.0.0:8080", "/workspace"]

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      CI: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: node ./node_modules/vite/bin/vite.js --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  backend_venv:
  frontend_node_modules:
  code_server_config:
  code_server_data:
