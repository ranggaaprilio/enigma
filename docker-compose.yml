services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-execute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-execute}
      POSTGRES_DB: ${POSTGRES_DB:-execute_dashboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Epic 05: transaction-mode PgBouncer, opt-in with `--profile pgbouncer`. Point the app at it
  # with DATABASE_URL=postgresql+asyncpg://execute:execute@pgbouncer:5432/execute_dashboard and
  # DB_PGBOUNCER=true; run migrations against postgres directly. No host port: only services on
  # the compose network reach it, and it authenticates every client (scram-sha-256).
  pgbouncer:
    profiles: ["pgbouncer"]
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-execute}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-execute}
      DB_NAME: ${POSTGRES_DB:-execute_dashboard}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      # Server connections per database/user pair; the sum over pairs must fit max_connections.
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      # asyncpg prepares uniquely named statements; reset each server connection when it goes
      # back to the pool so they don't pile up (SQLAlchemy's asyncpg + PgBouncer guidance).
      SERVER_RESET_QUERY: DISCARD ALL
      SERVER_RESET_QUERY_ALWAYS: "1"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment: &backend-env
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://execute:execute@postgres:5432/execute_dashboard}
      DB_PGBOUNCER: ${DB_PGBOUNCER:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # No fallbacks: secrets must come from .env (see .env.example for how to generate them).
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY in .env}
      WORKSPACE_ENV_ENCRYPTION_KEY: ${WORKSPACE_ENV_ENCRYPTION_KEY:?set WORKSPACE_ENV_ENCRYPTION_KEY in .env}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-https://app.daytona.io/api}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-}
      DAYTONA_DEFAULT_SNAPSHOT: ${DAYTONA_DEFAULT_SNAPSHOT:-}
      DAYTONA_DEFAULT_LANGUAGE: ${DAYTONA_DEFAULT_LANGUAGE:-python}
      DAYTONA_AUTO_STOP_MINUTES: ${DAYTONA_AUTO_STOP_MINUTES:-30}
      DAYTONA_PREVIEW_URL_TTL_SECONDS: ${DAYTONA_PREVIEW_URL_TTL_SECONDS:-3600}
      DAYTONA_PREVIEW_PROXY_BASE_URL: ${DAYTONA_PREVIEW_PROXY_BASE_URL:-http://localhost:8001}
      DAYTONA_PREVIEW_PROXY_TTL_SECONDS: ${DAYTONA_PREVIEW_PROXY_TTL_SECONDS:-3600}
      # LLM vars are the fallback: the global settings stored from the UI take precedence.
      AGENT_PROVIDER: ${AGENT_PROVIDER:-auto}
      OPENHANDS_LLM_BASE_URL: ${OPENHANDS_LLM_BASE_URL:-}
      OPENHANDS_LLM_API_KEY: ${OPENHANDS_LLM_API_KEY:-}
      OPENHANDS_LLM_MODEL: ${OPENHANDS_LLM_MODEL:-}
      OPENHANDS_MAX_ITERATIONS: ${OPENHANDS_MAX_ITERATIONS:-30}
      OPENHANDS_SUPPRESS_BANNER: "1"
      AGENT_COMMAND_DENY_DANGEROUS: ${AGENT_COMMAND_DENY_DANGEROUS:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AGENT_ALLOW_MOCK_PROVIDER: ${AGENT_ALLOW_MOCK_PROVIDER:-false}
      # inline: runs execute inside this API process. queue: runs are enqueued for the `worker`
      # service (start it with `--profile queue`). Switch only with no runs active.
      RUN_EXECUTION_MODE: ${RUN_EXECUTION_MODE:-inline}
    ports:
      - "8000:8000"
    # Above SHUTDOWN_DRAIN_DELAY_SECONDS + SHUTDOWN_RUN_GRACE_SECONDS (5 + 15) plus pool close,
    # so SIGKILL never lands mid-drain.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    command: sh -lc "git config --global --replace-all safe.directory '*' && uv sync --locked --no-dev && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Epic 02: executes agent/command runs and Spec Kit finalizers when RUN_EXECUTION_MODE=queue.
  # `podman compose --profile queue up` (scale with `--scale worker=N`). WORKER_ID defaults to
  # the container hostname, which is unique per replica and stable across a restart.
  worker:
    profiles: ["queue"]
    build:
      context: ./backend
    environment:
      <<: *backend-env
      # Epic 05: a smaller pool per worker, so a run surge cannot take the connections the API
      # needs (ignored behind PgBouncer, which pools for everyone).
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-2}
    # Above SHUTDOWN_RUN_GRACE_SECONDS (arq's job_completion_wait) plus the shutdown sweep.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - worker_venv:/app/.venv
    command: sh -lc "git config --global --replace-all safe.directory '*' && uv sync --locked --no-dev && exec uv run arq app.worker.WorkerSettings"

  preview-proxy:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://execute:execute@postgres:5432/execute_dashboard}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY in .env}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-https://app.daytona.io/api}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-}
      DAYTONA_PROVISION_TIMEOUT_SECONDS: ${DAYTONA_PROVISION_TIMEOUT_SECONDS:-120}
      DAYTONA_PREVIEW_PROXY_BASE_URL: ${DAYTONA_PREVIEW_PROXY_BASE_URL:-http://localhost:8001}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - preview_proxy_venv:/app/.venv
    command: sh -lc "git config --global --replace-all safe.directory '*' && uv sync --locked --no-dev && uv run uvicorn app.preview_proxy:app --host 0.0.0.0 --port 8001 --reload"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      CI: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -lc "pnpm install --frozen-lockfile && rm -rf node_modules/.vite && exec node ./node_modules/vite/bin/vite.js --host 0.0.0.0 --force"

volumes:
  postgres_data:
  redis_data:
  backend_venv:
  worker_venv:
  preview_proxy_venv:
  frontend_node_modules:
