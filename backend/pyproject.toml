[project]
name = "execute-dashboard-backend"
version = "0.1.0"
description = "FastAPI backend for the Execute Dashboard foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "cryptography>=43.0.1",
  "daytona==0.185.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "openhands-sdk==1.28.0",
  "openhands-tools==1.28.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "pydantic-settings>=2.5.2",
  "arq>=0.28,<0.29",
  "redis>=5.1.0,<6",
  "sqlalchemy[asyncio]>=2.0.35",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.30.6",
  "websockets>=16.0",
  "opentelemetry-instrumentation-fastapi==0.60b1",
  "opentelemetry-instrumentation-sqlalchemy==0.60b1",
  "opentelemetry-instrumentation-redis==0.60b1",
  "opentelemetry-instrumentation-httpx==0.60b1",
  "opentelemetry-instrumentation-aiohttp-client==0.60b1",
  "opentelemetry-sdk==1.39.1",
  "opentelemetry-exporter-otlp-proto-http==1.39.1",
  "docker>=7.1",
]

[dependency-groups]
dev = [
  "fakeredis>=2.36",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pyyaml>=6.0",
  "ruff>=0.6.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Depends",
  "fastapi.Security",
]
