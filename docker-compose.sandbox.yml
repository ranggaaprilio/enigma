# Opt-in: run sandboxes as local Docker/Podman containers (runtime="docker") instead of, or
# next to, Daytona. See docs/local-docker-runtime/.
#
#   ./sandbox/build-local-image.sh                     # once: builds enigma-sandbox:latest
#   podman compose -f docker-compose.yml -f docker-compose.sandbox.yml up
#   # queue mode: add --profile queue (the worker executes runs, so it needs the daemon too)
#
# SECURITY: the container daemon socket is root-equivalent on the host. Only the services
# that drive sandboxes get it — the backend (provision, files, terminals) and the worker
# (queue-mode runs) — and only through this file. The preview proxy joins in
# local-docker-runtime Epic 04, when it starts dialling sandboxes. Sandbox containers never
# get it (DockerRuntime refuses any sandbox spec with mounts), and the agent's command
# denylist keeps `docker`/`docker-compose` blocked inside them. Never use this on a shared
# host. Trusted services are deliberately NOT attached to the sandboxes' bridge network
# (DockerRuntime creates `enigma-sandboxes` itself), so a sandbox cannot reach them.
#
# DOCKER_SOCKET is the daemon socket path *where the containers run*:
#   - Docker (Linux / Docker Desktop):  /var/run/docker.sock (default)
#   - Podman machine (macOS/Windows):   the VM's socket — `podman machine inspect` shows it;
#     for a rootful machine /var/run/docker.sock is a symlink to /run/podman/podman.sock
#   - Podman on Linux (rootless):       $XDG_RUNTIME_DIR/podman/podman.sock, with
#     `systemctl --user enable --now podman.socket` (or `podman system service --time=0`)

x-sandbox-access: &sandbox-access
  volumes:
    - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
  # SELinux hosts (Podman machine, Fedora/RHEL) deny a container the daemon socket without
  # this; hosts without SELinux ignore it. Applies to the socket holders only.
  security_opt:
    - label=disable

x-sandbox-env: &sandbox-env
  SANDBOX_RUNTIME_DEFAULT: ${SANDBOX_RUNTIME_DEFAULT:-docker}
  DOCKER_SANDBOX_IMAGE: ${DOCKER_SANDBOX_IMAGE:-enigma-sandbox:latest}
  DOCKER_SANDBOX_NETWORK: ${DOCKER_SANDBOX_NETWORK:-enigma-sandboxes}
  DOCKER_SANDBOX_CPUS: ${DOCKER_SANDBOX_CPUS:-2}
  DOCKER_SANDBOX_MEMORY_MB: ${DOCKER_SANDBOX_MEMORY_MB:-4096}
  DOCKER_SANDBOX_PIDS_LIMIT: ${DOCKER_SANDBOX_PIDS_LIMIT:-4096}
  DOCKER_MAX_CONCURRENT_EXECS: ${DOCKER_MAX_CONCURRENT_EXECS:-64}

services:
  backend:
    <<: *sandbox-access
    environment: *sandbox-env
  worker:
    <<: *sandbox-access
    environment: *sandbox-env
