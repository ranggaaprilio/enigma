# Pre-deploy step: `alembic upgrade head` against Postgres directly (never PgBouncer). Run it
# and wait for completion BEFORE rolling the Deployments -- see deploy/README.md for the release
# sequence. Old and new replicas then coexist on the new schema, so every migration must be an
# expand step (tests/test_migration_safety.py). Argo CD / Helm users: annotate it as a PreSync /
# pre-upgrade hook instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: enigma-migrate
  labels:
    app.kubernetes.io/name: enigma
    app.kubernetes.io/component: migrate
    enigma/phase: pre-deploy
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enigma
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: enigma-backend:dev
          args: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: enigma-config
            # Settings validates every secret outside `local`, even for a migration.
            - secretRef:
                name: enigma-secrets
          env:
            # Direct Postgres URL: DATABASE_URL may point at PgBouncer in transaction mode,
            # which Alembic's DDL transaction must bypass. Same value when there is no PgBouncer.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: enigma-secrets
                  key: MIGRATION_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
