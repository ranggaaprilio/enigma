# Stateless API tier: any replica serves any request or WebSocket (no affinity). Scales on CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enigma-api
  labels:
    app.kubernetes.io/name: enigma
    app.kubernetes.io/component: api
spec:
  # No `replicas`: the HPA owns the count.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: enigma
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A new pod must pass /ready before an old one starts draining.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enigma
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      # SHUTDOWN_DRAIN_DELAY_SECONDS (10) + SHUTDOWN_RUN_GRACE_SECONDS (15) + pool close. The
      # app delays its own SIGTERM hand-off, so no preStop sleep is needed.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: enigma
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: enigma-backend:dev
          args: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: enigma-config
            - secretRef:
                name: enigma-secrets
          startupProbe:
            httpGet:
              path: /live
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          # Dependency-free: a Postgres or Redis outage must not restart every replica.
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Gates traffic during start-up and drain (503 while draining).
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: enigma-api
  labels:
    app.kubernetes.io/name: enigma
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: enigma
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enigma-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enigma-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    # Scaling in closes that pod's WebSockets (clients reconnect); don't flap.
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: enigma-api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enigma
      app.kubernetes.io/component: api
