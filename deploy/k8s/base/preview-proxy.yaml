# Stateless preview proxy (Epic 07). Every check is HMAC over AUTH_SECRET_KEY + Postgres, so any
# replica serves any preview host; no stickiness. Scales on CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enigma-preview-proxy
  labels:
    app.kubernetes.io/name: enigma
    app.kubernetes.io/component: preview-proxy
spec:
  # No `replicas`: the HPA owns the count.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: enigma
      app.kubernetes.io/component: preview-proxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enigma
        app.kubernetes.io/component: preview-proxy
    spec:
      automountServiceAccountToken: false
      # SHUTDOWN_DRAIN_DELAY_SECONDS (10) + --timeout-graceful-shutdown (20) for in-flight
      # proxied streams; open WebSockets close with 1012 and reconnect through another replica.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: enigma
              app.kubernetes.io/component: preview-proxy
      containers:
        - name: preview-proxy
          image: enigma-backend:dev
          args:
            - uvicorn
            - app.preview_proxy:app
            - --host
            - 0.0.0.0
            - --port
            - "8001"
            - --no-server-header
            - --timeout-graceful-shutdown
            - "20"
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: enigma-config
          # Least privilege: only the secrets the proxy reads, not the whole enigma-secrets.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: enigma-secrets
                  key: DATABASE_URL
            - name: AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: enigma-secrets
                  key: AUTH_SECRET_KEY
            # Not used by the proxy, but Settings refuses to boot outside `local` without it.
            - name: WORKSPACE_ENV_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: enigma-secrets
                  key: WORKSPACE_ENV_ENCRYPTION_KEY
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: enigma-secrets
                  key: METRICS_TOKEN
            - name: DAYTONA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: enigma-secrets
                  key: DAYTONA_API_KEY
            - name: DB_POOL_SIZE
              value: "3"
            - name: DB_MAX_OVERFLOW
              value: "2"
          # Probes hit the pod IP, a non-preview Host, so the proxy answers them itself.
          startupProbe:
            httpGet:
              path: /live
              port: 8001
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: enigma-preview-proxy
  labels:
    app.kubernetes.io/name: enigma
    app.kubernetes.io/component: preview-proxy
spec:
  selector:
    app.kubernetes.io/name: enigma
    app.kubernetes.io/component: preview-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
---
# CPU, not connections: an open-WebSocket metric (preview_proxy_active_websockets) needs a
# Prometheus adapter; switch the metric here once one is installed (Epic 09).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enigma-preview-proxy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enigma-preview-proxy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: enigma-preview-proxy
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enigma
      app.kubernetes.io/component: preview-proxy
