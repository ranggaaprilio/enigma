# Static host for the production frontend image (Dockerfile `runtime` target).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Probe target for the orchestrator; never logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted by Vite: a new release ships new file names, so these never change.
    # (add_header in a location drops the server-level ones, hence the repeats.) Cache-Control
    # is deliberately not `always`: a 404 -- a new index.html asking an old pod mid-rollout --
    # must not be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Names the current fingerprints: always revalidate, so a release is picked up on reload.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routes (react-router BrowserRouter) all render index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
