name: Feature request
description: Propose an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Enigma makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Mention which surface (agent, preview, editor, repository, sandbox runtime, ...) it touches.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: docs
    attributes:
      label: Related planning documents
      description: The docs/ folder holds the roadmap. Checking here helps route the request.
      options:
        - label: I looked through docs/improvement-epics and docs/*/00-index.md and this is not already planned
