name: Docker integration

# The local Docker sandbox provider against a real daemon and the built sandbox image
# (local-docker-runtime Epic 06): DOCKER_INTEGRATION_TESTS=1 tests/test_docker_integration.py.
# Opt-in and weekly, not per PR: the image is ~9 GB and the tests need outbound network from
# the sandbox (template clones, npm). The provider contract on fakes (tests/sandbox/
# test_conformance.py) runs in the main CI's pytest step.
"on":
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC

permissions:
  contents: read

concurrency:
  group: docker-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-integration:
    name: Docker provider (real daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: execute
          POSTGRES_PASSWORD: execute
          POSTGRES_DB: execute_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U execute -d execute_dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://execute:execute@localhost:5432/execute_dashboard
      REDIS_URL: redis://localhost:6379/0
      DOCKER_INTEGRATION_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space for the sandbox image
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Build the sandbox image
        working-directory: .
        run: CONTAINER_CLI=docker ./sandbox/build-local-image.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Test (real daemon)
        run: uv run pytest tests/test_docker_integration.py -v

      - name: No sandbox left behind
        if: always()
        run: |
          docker ps -a --filter label=enigma.managed=1 --format '{{.Names}}' | tee /tmp/leaked
          docker network ls --format '{{.Name}}' | grep '^enigma-sbx-' | tee -a /tmp/leaked || true
          test ! -s /tmp/leaked
