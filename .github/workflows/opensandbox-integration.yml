name: OpenSandbox integration

# The OpenSandbox provider against a real opensandbox-server started from the reference
# config (Plan 7a Task 7): OPENSANDBOX_INTEGRATION_TESTS=1 tests/test_opensandbox_integration.py.
# This security suite (container floor, sibling isolation, auth, egress, terminal, upkeep) is
# the gate for making OpenSandbox the self-host default (Plan 7b). Opt-in and weekly, like the
# Docker one: it builds the ~9 GB sandbox image and needs outbound network from sandboxes.
"on":
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC, after the Docker suite

permissions:
  contents: read

concurrency:
  group: opensandbox-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opensandbox-integration:
    name: OpenSandbox provider (real server)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: execute
          POSTGRES_PASSWORD: execute
          POSTGRES_DB: execute_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U execute -d execute_dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://execute:execute@localhost:5432/execute_dashboard
      REDIS_URL: redis://localhost:6379/0
      OPENSANDBOX_INTEGRATION_TESTS: "1"
      OPENSANDBOX_API_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space for the sandbox image
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Build the sandbox image
        working-directory: .
        run: CONTAINER_CLI=docker ./sandbox/build-local-image.sh

      - name: Pull the execd and egress images
        run: docker pull opensandbox/execd:v1.1.0 && docker pull opensandbox/egress:v1.1.7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Start opensandbox-server from the reference config
        working-directory: .
        run: |
          key=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$key"
          echo "OPENSANDBOX_API_KEY=$key" >> "$GITHUB_ENV"
          sed "s|/var/lib/opensandbox/opensandbox.db|$RUNNER_TEMP/opensandbox.db|" \
            deploy/opensandbox/sandbox.toml > "$RUNNER_TEMP/sandbox.toml"
          OPENSANDBOX_SERVER_API_KEY="$key" nohup uvx --python 3.12 \
            --from 'opensandbox-server==1.2.1' opensandbox-server \
            --config "$RUNNER_TEMP/sandbox.toml" > "$RUNNER_TEMP/opensandbox.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8080/health && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/opensandbox.log"; exit 1

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Test (real server)
        run: uv run pytest tests/test_opensandbox_integration.py -v

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/opensandbox.log"

      - name: No sandbox left behind
        if: always()
        run: |
          docker ps -a --format '{{.Names}}' | grep '^sandbox-' | tee /tmp/leaked || true
          test ! -s /tmp/leaked
