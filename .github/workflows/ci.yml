name: CI

"on":
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: execute
          POSTGRES_PASSWORD: execute
          POSTGRES_DB: execute_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U execute -d execute_dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # ENVIRONMENT stays "local" so the fail-fast secret check does not trip in CI.
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://execute:execute@localhost:5432/execute_dashboard
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm --filter execute-dashboard-frontend run lint

      - name: Test (vitest)
        run: pnpm --filter execute-dashboard-frontend run test

      - name: Build + typecheck (tsc -b && vite build)
        run: pnpm --filter execute-dashboard-frontend run build
