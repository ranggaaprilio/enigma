name: CI

# Disabled temporarily: no longer runs on pull requests or pushes. Restore the
# pull_request/push triggers below to re-enable.
"on":
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches:
  #     - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: execute
          POSTGRES_PASSWORD: execute
          POSTGRES_DB: execute_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U execute -d execute_dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # ENVIRONMENT stays "local" so the fail-fast secret check does not trip in CI.
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://execute:execute@localhost:5432/execute_dashboard
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm --filter execute-dashboard-frontend run lint

      - name: Test (vitest)
        run: pnpm --filter execute-dashboard-frontend run test

      - name: Build + typecheck (tsc -b && vite build)
        run: pnpm --filter execute-dashboard-frontend run build

  # Epic 08: the production images and Kubernetes manifests. Builds and scans only -- nothing is
  # pushed or deployed from here. Tool images are pinned; Trivy's vulnerability DB is fetched
  # fresh on every run.
  deploy:
    name: Deploy artifacts (manifests + images)
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.6.7
      TRIVY_IMAGE: aquasec/trivy:0.56.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render manifests (kustomize)
        run: kubectl kustomize deploy/k8s/overlays/production > rendered.yaml

      - name: Validate manifests (kubeconform, incl. KEDA CRDs)
        run: >-
          docker run --rm -v "$PWD:/work:ro" "$KUBECONFORM_IMAGE"
          -strict -summary -kubernetes-version 1.30.0
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          /work/rendered.yaml

      - name: Build backend image
        run: docker build -t enigma-backend:ci backend

      - name: Build frontend image
        run: >-
          docker build -t enigma-frontend:ci
          --build-arg VITE_API_BASE_URL=https://api.enigma.example.com frontend

      - name: Scan images (Trivy, HIGH/CRITICAL with a fix available)
        run: |
          for image in enigma-backend:ci enigma-frontend:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln "$image"
            # Secrets in our own layers only: third-party packages ship PEM-marker constants
            # and README examples that are not credentials.
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --exit-code 1 --scanners secret --skip-dirs /app/.venv "$image"
          done
